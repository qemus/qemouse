name: Build

on:
  workflow_dispatch:

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      actions: write
      packages: write
      contents: read
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      -
        name: Create a release
        uses: action-pack/github-release@v2
        with:
          tag: "v${{ vars.MAJOR }}.${{ vars.MINOR }}"
          title: "${{ vars.MAJOR }}.${{ vars.MINOR }}"
          token: ${{ secrets.REPO_ACCESS_TOKEN }}
      -
        name: Increment version variable
        uses: action-pack/bump@v2
        with:
          token: ${{ secrets.REPO_ACCESS_TOKEN }}
      -
        name: Send mail
        uses: action-pack/send-mail@v1
        with:
          to: ${{secrets.MAILTO}}
          from: Github Actions <${{secrets.MAILTO}}>
          connection_url: ${{secrets.MAIL_CONNECTION}}
          subject: Build of ${{ github.event.repository.name }} ${{ vars.MAJOR }}.${{ vars.MINOR }} completed
          body: |
              The build job of ${{ github.event.repository.name }} ${{ vars.MAJOR }}.${{ vars.MINOR }} was completed successfully!

              See https://github.com/${{ github.repository }}/actions for more information.